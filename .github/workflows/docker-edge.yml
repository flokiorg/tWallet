name: Publish edge image

# Every push to main gets an image, so there is something to run without
# waiting for a release. These are explicitly not releases: :edge always moves.
# Use a release tag for anything you care about.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  # Same tag set ci.yaml and the release build use.
  BUILD_TAGS: walletrpc chainrpc invoicesrpc routerrpc peersrpc

jobs:
  docker:
    name: Build and push edge image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Dockerfile.release copies a prebuilt binary, so build it into the
      # directory used as the build context.
      - name: Build linux/amd64 binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -tags="$BUILD_TAGS" -ldflags "-s -w" -o dist/twallet .

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile.release
          push: true
          tags: |
            ghcr.io/flokiorg/twallet:edge
            ghcr.io/flokiorg/twallet:${{ github.sha }}
